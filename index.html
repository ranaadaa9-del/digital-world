<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>العالم الرقمي بين يديك</title>
<style>
:root{--pink:#d94f91;--deep:#a92f70;--pale:#fff1f8;--silver:#d9dce4;--ink:#43283a}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#fff7fb,#f6f5fa);color:var(--ink)}
header{padding:26px 18px;text-align:center;background:linear-gradient(135deg,#f9c8e0,#fff,#e6e7ef);border-bottom:1px solid var(--silver)}
header .spark{font-size:28px}h1{margin:8px 0;color:var(--deep);font-size:clamp(25px,5vw,42px)}header p{margin:8px auto;max-width:650px;line-height:1.8}
main{max-width:1000px;margin:auto;padding:22px 15px 45px}.intro{text-align:center;line-height:1.9}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px}
.card{border:1px solid #f0c9dd;border-radius:20px;background:#fff;padding:20px;text-align:right;box-shadow:0 7px 20px #b54b7b12;cursor:pointer;transition:.2s;color:var(--ink);font:inherit}
.card:hover{transform:translateY(-3px);border-color:var(--pink)}.emoji{font-size:30px}.card h2{font-size:19px;margin:10px 0 6px;color:var(--deep)}.card p{line-height:1.7;margin:0;color:#795c70;font-size:14px}
.panel{background:#fff;border:1px solid #f0c9dd;border-radius:22px;padding:clamp(17px,4vw,30px);box-shadow:0 8px 24px #b54b7b10}
.hidden{display:none}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;background:var(--pink);color:white;font-weight:bold}button:hover{background:var(--deep)}button.secondary{background:#f4e5ed;color:var(--deep);border:1px solid #edc4d9}
h2,h3{color:var(--deep)}.bodycopy{line-height:2}.mind{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:18px 0;padding:20px;background:#fff6fb;border-radius:16px;border:1px dashed #e7a8ca}.mind span{background:#fff;border:1px solid #e9b5d0;border-radius:30px;padding:10px 14px}.mind strong{background:var(--deep);color:white;border-radius:30px;padding:12px 16px}
.columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;margin-top:18px}.mini{background:#fff9fc;border:1px solid #f2d4e3;padding:16px;border-radius:16px;line-height:1.9}
.question{padding:15px;border-radius:15px;background:#fbf7fa;margin:12px 0}.answers{display:grid;gap:8px;margin-top:12px}.answers button{background:white;color:var(--ink);border:1px solid #e3c8d7;text-align:right}.answers button:hover{border-color:var(--pink);background:#fff0f7}.feedback{font-weight:bold;margin-top:10px}.progress{color:#795c70;font-size:13px}
footer{text-align:center;padding:18px;color:#96798c;font-size:13px}
</style>
</head>
<body>
<header><div class="spark">✦ ♡ ✦</div><h1>العالم الرقمي بين يديك</h1><p>رحلة تفاعلية نتعلّم فيها كيف نستخدم التقنية بوعي وأمان، ونكتشف أدوات المستقبل.</p></header>
<main>
<section id="home">
<div class="intro"><h2>اختاري عالمك الرقمي</h2><p>اضغطي على أي موضوع لتشاهدي شرحًا مبسّطًا وخريطة ذهنية ونشاطًا واختبارًا قصيرًا.</p></div>
<div class="cards" id="cards"></div>
</section>
<section id="topic" class="hidden">
<div class="panel">
<div class="topline"><button class="secondary" onclick="goHome()">← العودة للمواضيع</button><span class="progress" id="topicCount"></span></div>
<div id="topicContent"></div>
</div>
</section>
</main>
<footer>تصميم تعليمي تفاعلي • الوردي والفضي والأبيض</footer>
<script>
const topics=[
{title:"المواطنة الرقمية",icon:"🌐",short:"حقوقنا ومسؤولياتنا في العالم الإلكتروني",intro:"المواطنة الرقمية هي استخدام التقنية والإنترنت بطريقة مسؤولة ومحترمة وآمنة، مع معرفة الحقوق والواجبات الرقمية.",branches:["الاحترام","الخصوصية","المسؤولية","التفكير قبل النشر"],example:"قبل نشر صورة لصديقتك، استأذنيها أولًا واحترمي رغبتها.",activity:"وصلتك رسالة فيها إشاعة عن طالبة؛ ما التصرف الصحيح؟",choices:["أنشرها بسرعة","أتحقق من صحتها ولا أعيد نشرها","أضيف تعليقًا ساخرًا"],correct:1,explain:"التحقق وعدم نشر الإشاعات من السلوكيات المسؤولة رقميًا."},
{title:"التحول الرقمي",icon:"📱",short:"كيف تجعل التقنية الخدمات أسهل وأسرع",intro:"التحول الرقمي هو توظيف التقنيات الرقمية لتطوير الخدمات وطريقة إنجاز الأعمال، مثل التعلم الإلكتروني والخدمات الحكومية الرقمية.",branches:["سرعة الإنجاز","الخدمات الإلكترونية","التعلم عن بُعد","توفير الوقت"],example:"استخدام منصة إلكترونية لإتمام خدمة بدلًا من زيارة المكان شخصيًا.",activity:"تريدين إنجاز خدمة إلكترونية؛ ما الفائدة الأساسية من استخدامها؟",choices:["زيادة الخطوات دائمًا","تسهيل الوصول للخدمة وتوفير الوقت","إلغاء أهمية حماية البيانات"],correct:1,explain:"الخدمات الرقمية قد تسهّل الإنجاز وتوفّر الوقت، مع ضرورة حماية البيانات."},
{title:"الأمن السيبراني",icon:"🛡️",short:"حماية الحسابات والأجهزة والمعلومات",intro:"الأمن السيبراني هو حماية الأجهزة والشبكات والحسابات والبيانات من الاختراق والسرقة والتهديدات الرقمية.",branches:["كلمة مرور قوية","التحقق الثنائي","تحديث الأجهزة","الحذر من الروابط"],example:"لا تفتحي رابطًا مجهولًا يطلب كلمة المرور، واستخدمي التحقق بخطوتين.",activity:"وصلك رابط غريب يطلب تسجيل الدخول إلى حسابك؛ ماذا تفعلين؟",choices:["أفتحه وأكتب بياناتي","أرسله للجميع","لا أفتحه وأتحقق من مصدره"],correct:2,explain:"تجنّب الروابط المجهولة والتحقق من مصدرها يساعدان على حماية الحساب."},
{title:"التنمر الإلكتروني",icon:"💗",short:"التعامل باحترام والإبلاغ عن الإساءة",intro:"التنمر الإلكتروني هو استخدام الرسائل أو المنصات الرقمية لإيذاء شخص أو إحراجه أو تهديده بشكل متكرر.",branches:["الاحترام","عدم المشاركة","حفظ الأدلة","الحظر والإبلاغ"],example:"إذا شاهدتِ تعليقًا جارحًا، لا تشاركي في الإساءة، واطلبي مساعدة شخص بالغ موثوق وأبلغي المنصة.",activity:"شاهدتِ مجموعة تسخر من طالبة عبر الإنترنت؛ ما الخيار الأفضل؟",choices:["أشاركهم السخرية","أدعم الطالبة وأبلغ عن الإساءة وأطلب المساعدة","أعيد نشر الصور"],correct:1,explain:"الدعم والإبلاغ وطلب المساعدة خطوات أفضل من المشاركة في الإساءة."},
{title:"الذكاء الاصطناعي",icon:"🤖",short:"تقنيات تتعلم من البيانات وتساعدنا",intro:"الذكاء الاصطناعي مجال تقني يطوّر أنظمة تستطيع تنفيذ مهام مثل فهم اللغة وتحليل الصور وتقديم اقتراحات، وقد يساعد في التعلم والإبداع.",branches:["التعلم","تحليل البيانات","الإبداع","الاستخدام المسؤول"],example:"يمكن استخدام أداة ذكية لاقتراح أفكار للمذاكرة، ثم مراجعة المعلومات والتأكد من صحتها.",activity:"قدّمت لك أداة ذكاء اصطناعي معلومة مهمة؛ ماذا تفعلين؟",choices:["أصدقها دائمًا دون تحقق","أراجعها من مصادر موثوقة","أشاركها حتى لو لم أفهمها"],correct:1,explain:"قد تخطئ أدوات الذكاء الاصطناعي، لذلك يجب التحقق من المعلومات وعدم مشاركة البيانات الخاصة."}
];
const cards=document.getElementById("cards");
topics.forEach((t,i)=>{const b=document.createElement("button");b.className="card";b.innerHTML=`<div class="emoji">${t.icon}</div><h2>${t.title}</h2><p>${t.short}</p>`;b.onclick=()=>openTopic(i);cards.appendChild(b)});
function openTopic(i){const t=topics[i];document.getElementById("home").classList.add("hidden");document.getElementById("topic").classList.remove("hidden");document.getElementById("topicCount").textContent=`الموضوع ${i+1} من ${topics.length}`;document.getElementById("topicContent").innerHTML=`
<h2 style="font-size:28px">${t.icon} ${t.title}</h2><h3>١. تعرّفي على الموضوع</h3><p class="bodycopy">${t.intro}</p>
<h3>٢. الخريطة الذهنية</h3><div class="mind"><strong>${t.title}</strong>${t.branches.map(x=>`<span>${x}</span>`).join("")}</div>
<div class="columns"><div class="mini"><h3>٣. مثال من الحياة</h3>${t.example}</div><div class="mini"><h3>٤. نشاط تفاعلي</h3>${t.activity}<div class="answers">${t.choices.map((c,j)=>`<button onclick="checkActivity(${i},${j},this)">${c}</button>`).join("")}</div><div id="activityFeedback" class="feedback"></div></div></div>
<h3>٥. اختبري معلوماتك</h3><div class="question"><b>${t.activity}</b><div class="answers">${t.choices.map((c,j)=>`<button onclick="checkQuiz(${i},${j},this)">${c}</button>`).join("")}</div><div id="quizFeedback" class="feedback"></div></div>
<div class="topline"><button class="secondary" onclick="openTopic(${(i+topics.length-1)%topics.length})">الموضوع السابق</button><button onclick="openTopic(${(i+1)%topics.length})">الموضوع التالي ←</button></div>`;window.scrollTo({top:0,behavior:"smooth"})}
function checkActivity(i,j,btn){const t=topics[i];const f=document.getElementById("activityFeedback");f.textContent=j===t.correct?"أحسنتِ! "+t.explain:"حاولي مرة أخرى. فكّري في الخيار الأكثر أمانًا واحترامًا.";f.style.color=j===t.correct?"#16804a":"#b52d64"}
function checkQuiz(i,j,btn){const t=topics[i];const f=document.getElementById("quizFeedback");f.textContent=j===t.correct?"إجابة صحيحة! "+t.explain:"ليست الإجابة الأفضل. "+t.explain;f.style.color=j===t.correct?"#16804a":"#b52d64"}
function goHome(){document.getElementById("topic").classList.add("hidden");document.getElementById("home").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}
</script>
</body></html>
